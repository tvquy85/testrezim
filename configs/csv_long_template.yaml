# Template for real market data in long CSV format.
# Required columns by default: date, asset, label, plus feature columns.
# label must be the future return AFTER observing the same date's features.
seed: 2027
device: auto
output_dir: outputs/real_crc_lora

data:
  path: data/your_market_long.csv
  format: csv_long
  lookback: 16
  horizon: 1
  close_index: 0
  feature_scaler: train_standard
  batch_size: 4
  csv:
    date_col: date
    asset_col: asset
    label_col: label
    sector_col: sector
    # feature_cols: [close, ret1, ret_ma5, ret_vol5, price_vs_ma20, volume_z]
    feature_cols: null

context:
  enabled: true
  lookback: 16
  features: [mean, slope, vol, dispersion, pca_ratio]
  scaler: train_standard

model:
  name: crc_lora
  hidden_dim: 64
  dropout: 0.10
  rank: 8

loss:
  mse_weight: 1.0
  bpr_weight: 0.10
  ic_weight: 0.05
  topk: 10

optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 30
  patience: 7
  grad_clip: 1.0

eval:
  topk: 10
  trading_days: 252
  transaction_cost_bps: [0, 5, 10, 25]
