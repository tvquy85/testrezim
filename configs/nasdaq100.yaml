seed: 2027
device: auto
output_dir: outputs/nasdaq100_crc_lora

# ── Data ──────────────────────────────────────────────────────────────────────
# Generated by: python scripts/make_nasdaq100_data.py
# Universe    : ~95 most-liquid NASDAQ-100 stocks (tech/growth-heavy)
# Period      : 2015-2023  (train 60% / valid 20% / test 20%)
# Regimes     : 2017-19 rate-driven growth | 2020 COVID volatility | 2021 ZIRP peak | 2022 rate-shock bear
# Context     : Tech sector regime highly correlated (IT ~60%, CommSvcs ~20%)
data:
  path: data/nasdaq100.npz
  format: npz
  lookback: 20
  horizon: 1
  close_index: 0
  feature_scaler: train_standard
  batch_size: 32
  split:
    train: 0.60
    valid: 0.20
    test: 0.20

# ── Causal Market Context ─────────────────────────────────────────────────────
context:
  enabled: true
  lookback: 20
  features: [mean, slope, vol, dispersion, pca_ratio]
  scaler: train_standard
  shuffle: false
  noise: false
  lag: 0

# ── Model (CRC-LoRA) ──────────────────────────────────────────────────────
model:
  name: crc_lora
  hidden_dim: 64
  dropout: 0.10
  rank: 8
  use_sector: false

# ── Loss ──────────────────────────────────────────────────────────────────
loss:
  mse_weight: 1.0
  bpr_weight: 0.10
  ic_weight: 0.05
  portfolio_weight: 0.00
  topk: 10
  max_pairs: 4096

# ── Optimiser ─────────────────────────────────────────────────────────────
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  patience: 8
  grad_clip: 1.0
  amp: true

cudnn_benchmark: true

# ── Evaluation ────────────────────────────────────────────────────────────
eval:
  topk: 10
  trading_days: 252
  transaction_cost_bps: [0, 5, 10]
