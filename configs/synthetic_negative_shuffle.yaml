seed: 2027
device: auto
output_dir: outputs/synthetic_crc_lora_shuffle_context

data:
  path: data/synthetic_market.npz
  format: npz
  lookback: 16
  horizon: 1
  close_index: 0
  feature_scaler: train_standard
  batch_size: 8

context:
  enabled: true
  lookback: 16
  features: [mean, slope, vol, dispersion, pca_ratio]
  scaler: train_standard
  shuffle: true
  noise: false

model:
  name: crc_lora
  hidden_dim: 64
  dropout: 0.10
  rank: 8

loss:
  mse_weight: 1.0
  bpr_weight: 0.10
  ic_weight: 0.05
  topk: 10

optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 20
  patience: 5
  grad_clip: 1.0

eval:
  topk: 10
  trading_days: 252
  transaction_cost_bps: [0, 5, 10]
